<header class="navbar-header">
  <div class="navbar-container">
    <!-- Logo & Title -->
    <div class="navbar-left">
      <a routerLink="/" class="logo-group">
        <div class="logo-icon-wrapper">
          <div class="logo-icon-inner">
            &gt;_
          </div>
        </div>
        <div class="logo-text-group">
          <span class="logo-title">
            Dev<span class="logo-accent">Companion</span>
            <span class="version-tag">v19</span>
          </span>
        </div>
      </a>

      <!-- Nav Links -->
      <nav class="nav-links">
        <a routerLink="/snippets" routerLinkActive="nav-link--active" [routerLinkActiveOptions]="{exact: true}"
           class="nav-link">
          Cheatsheets
        </a>
        <a routerLink="/snippets/new" routerLinkActive="nav-link--active"
           class="nav-link nav-link--highlight">
          <span class="plus-icon">+</span> New Snippet
        </a>
        <a routerLink="/query-builder" routerLinkActive="nav-link--active"
           class="nav-link">
          Query Builder
        </a>
        <a routerLink="/comparison" routerLinkActive="nav-link--active"
           class="nav-link">
          Comparison Matrix
        </a>
        <a routerLink="/mongo-templates" routerLinkActive="nav-link--active"
           class="nav-link">
          MongoDB Aggregations
        </a>
      </nav>
    </div>

    <!-- Right Action Items -->
    <div class="navbar-right">
      <!-- Command Palette Trigger -->
      <button (click)="openCommandPalette()"
              type="button"
              class="command-btn">
        <svg class="w-3.5 h-3.5 search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <span class="search-text">Search snippets...</span>
        <kbd class="kbd-badge">Ctrl K</kbd>
      </button>

      <!-- Theme Switcher Toggle Button (Light / Dark) -->
      <button (click)="toggleTheme()"
              type="button"
              class="theme-toggle-btn"
              [title]="themeService.isDark() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
              aria-label="Toggle Light/Dark Theme">
        @if (themeService.isDark()) {
          <!-- Moon Icon when in Dark Mode -->
          <svg class="theme-icon text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        } @else {
          <!-- Sun Icon when in Light Mode -->
          <svg class="theme-icon text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        }
      </button>

      <!-- Swagger Docs Link -->
      <a href="/swagger-ui.html" target="_blank"
         class="swagger-link"
         title="Open Swagger OpenAPI Documentation">
        <span class="status-dot status-dot--emerald"></span>
        <span class="swagger-text">Swagger</span>
      </a>

      <!-- Infra Status HUD Trigger -->
      <button (click)="toggleInfraHud()"
              type="button"
              class="hud-btn">
        <span class="status-dot status-dot--cyan"></span>
        <span class="hud-text">Infra HUD</span>
      </button>
    </div>
  </div>
</header>
