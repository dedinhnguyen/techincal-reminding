<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
  <!-- Back Button -->
  <a routerLink="/snippets" class="inline-flex items-center gap-2 text-xs font-mono text-slate-400 hover:text-emerald-400 transition-colors">
    &larr; Back to snippets
  </a>

  <div class="p-6 sm:p-8 rounded-2xl bg-slate-900 border border-slate-800 shadow-xl space-y-6">
    <div class="flex items-center gap-3 border-b border-slate-800 pb-4">
      <div class="p-2.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-bold font-mono text-white">
          {{ isEditMode() ? 'Edit Cheatsheet Snippet' : 'Create New Cheatsheet Snippet' }}
        </h1>
        <p class="text-xs text-slate-400 mt-0.5">
          {{ isEditMode() ? 'Update existing architectural pattern and variations' : 'Contribute a new pattern to the fullstack knowledge base' }}
        </p>
      </div>
    </div>

    <!-- Form Fields -->
    <form (ngSubmit)="saveSnippet()" class="space-y-4 font-mono text-xs">
      <!-- Title -->
      <div>
        <label class="block text-slate-400 mb-1 font-semibold">Title</label>
        <input type="text" [(ngModel)]="model.title" name="title" required
               placeholder="e.g. Spring Data JPA: Batch Inserts & Bulk Updates"
               class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 focus:border-emerald-500 focus:outline-none" />
      </div>

      <!-- Technology & Complexity -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">Technology</label>
          <select [(ngModel)]="model.technology" name="technology"
                  class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 focus:border-emerald-500 focus:outline-none">
            <option value="SPRING_DATA_JPA">Spring Data JPA</option>
            <option value="SQL_POSTGRES">Advanced SQL & PostgreSQL</option>
            <option value="JAVA">Java 21</option>
            <option value="ANGULAR">Angular 19</option>
            <option value="TYPESCRIPT">TypeScript / RxJS</option>
            <option value="SPRING_DATA_MONGODB">MongoDB</option>
            <option value="TAILWIND_CSS">TailwindCSS</option>
            <option value="REDIS">Redis Cache</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">Complexity Level</label>
          <select [(ngModel)]="model.complexityLevel" name="complexityLevel"
                  class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 focus:border-emerald-500 focus:outline-none">
            <option value="BEGINNER">Beginner</option>
            <option value="INTERMEDIATE">Intermediate</option>
            <option value="ADVANCED">Advanced</option>
            <option value="EXPERT">Expert</option>
          </select>
        </div>
      </div>

      <!-- Summary -->
      <div>
        <label class="block text-slate-400 mb-1 font-semibold">Summary</label>
        <textarea [(ngModel)]="model.summary" name="summary" rows="2" required
                  placeholder="Short description of the pattern or technique..."
                  class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 focus:border-emerald-500 focus:outline-none"></textarea>
      </div>

      <!-- Problem Context -->
      <div>
        <label class="block text-slate-400 mb-1 font-semibold">Problem Context / Motivation</label>
        <textarea [(ngModel)]="model.problemContext" name="problemContext" rows="2"
                  placeholder="Explain why this pattern is needed or what issue it solves..."
                  class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 focus:border-emerald-500 focus:outline-none"></textarea>
      </div>

      <!-- Code Template -->
      <div>
        <label class="block text-slate-400 mb-1 font-semibold">Code Template</label>
        <textarea [(ngModel)]="model.codeTemplate" name="codeTemplate" rows="6" required
                  placeholder="// Enter main code template here..."
                  class="w-full p-3 rounded-lg bg-[#0b0f19] border border-slate-800 text-slate-200 font-mono text-xs focus:border-emerald-500 focus:outline-none"></textarea>
      </div>

      <!-- Tag Names -->
      <div>
        <label class="block text-slate-400 mb-1 font-semibold">Tags (comma separated)</label>
        <input type="text" [(ngModel)]="tagsString" name="tagsString"
               placeholder="e.g. Spring, JPA, Performance, Cache"
               class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 focus:border-emerald-500 focus:outline-none" />
      </div>

      <!-- Actions -->
      <div class="pt-4 border-t border-slate-800 flex items-center justify-end gap-3">
        <a routerLink="/snippets"
           class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors">
          Cancel
        </a>
        <button type="submit"
                class="px-5 py-2 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold shadow-glow-emerald transition-all">
          {{ isEditMode() ? 'Save Changes' : 'Publish Snippet' }}
        </button>
      </div>
    </form>
  </div>
</div>
