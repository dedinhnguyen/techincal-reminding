server:
  port: 8080

spring:
  application:
    name: devcompanion-api

  datasource:
    # Supabase Transaction Pooler (port 6543) or Direct connection (port 5432)
    url: ${SUPABASE_DB_URL:jdbc:postgresql://db.epmqnamfibmgdeoeguqj.supabase.co:5432/postgres?sslmode=require}
    driverClassName: org.postgresql.Driver
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:Conheo_12conheo}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  cache:
    type: ${CACHE_TYPE:simple}

# DevCompanion Custom Properties
app:
  elasticsearch:
    enabled: ${ES_ENABLED:false}
  mongodb:
    enabled: ${MONGO_ENABLED:false}
  redis:
    enabled: ${REDIS_ENABLED:false}
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://*.vercel.app,http://localhost:3000}"
