server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: devcompanion-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # In-memory H2 default for instant zero-dependency run
  datasource:
    url: jdbc:h2:mem:devcompanion;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Redis Cache Config
  cache:
    type: ${CACHE_TYPE:simple} # local simple cache fallback, overridden by 'redis' in docker/prod
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

    # MongoDB Config
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/devcompanion}
      auto-index-creation: true

  # Elasticsearch Config
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 3s
    socket-timeout: 5s

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

# Management / Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# DevCompanion Custom Properties
app:
  elasticsearch:
    enabled: ${ES_ENABLED:false}
  mongodb:
    enabled: ${MONGO_ENABLED:false}
  redis:
    enabled: ${REDIS_ENABLED:false}
  cors:
    allowed-origins: "http://localhost:4200,http://localhost:80,http://localhost:3000"
